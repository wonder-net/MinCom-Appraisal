# symfony-backend/docker-compose.prod.yml — single-VM Docker Compose
# deployment. Run alongside docker-compose.yml's shared network/volume
# declarations are NOT reused on purpose (this is a fully separate stack,
# not an override file) — deploy with:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites on the VM before first start:
#   1. Copy .env.prod.local.dist to .env.prod.local and fill in every
#      value (see that file for exact generation commands). This file
#      never leaves the VM and is never baked into the image.
#   2. Generate the JWT keypair into the jwt_keys volume (one-time,
#      idempotent — --overwrite only if rotating):
#        docker compose -f docker-compose.prod.yml run --rm php \
#          php bin/console lexik:jwt:generate-keypair
#
# `db`/`redis` are bundled here for a simple single-VM setup. If using an
# external managed MySQL/Redis instead, delete those two services and
# point DATABASE_URL/MESSENGER_TRANSPORT_DSN in .env.prod.local at them —
# nothing else in this file needs to change.
#
# App\Service\ProductionConfigValidator (Kernel::boot()) refuses to boot
# if .env.prod.local is missing/incomplete, so a misconfigured deploy
# fails immediately and loudly instead of silently running insecure.
#
# DB engine is MySQL (see docker-compose.yml's header comment for why —
# same reasoning applies here, this file just carried the same stale
# Postgres service forward from before that engine migration).
#
# nginx builds from docker/nginx/Dockerfile's `prod` target: TLS
# termination + security headers + rate limiting (default.prod.conf)
# with the React SPA baked into the image at build time (no separate
# mount needed for frontend/dist) and Let's Encrypt certs bind-mounted
# read-only from the host (see docs/deployment.md Step 10 for how
# certbot obtains/renews those OUTSIDE this container). Before building,
# replace REPLACE_WITH_PRODUCTION_DOMAIN in docker/nginx/default.prod.conf
# with the real domain.
#
# Every service below carries a real ghcr.io image tag (not just a bare
# local tag) so `docker compose -f docker-compose.prod.yml pull` works —
# CI (.github/workflows/deploy.yml) builds and pushes both images under
# that tag on every push to main; `--build` still works locally too
# (falls back to the build: block when the tag can't be pulled, or when
# passed explicitly) for a VM without CI access. Set APP_VERSION to a
# short SHA or tag before pull/up — it defaults to "latest" otherwise.

networks:
  symfony_prod:
    driver: bridge

volumes:
  symfony_prod_mysql_data:
  symfony_prod_redis_data:
  # Persisted across container recreation — the private key must survive
  # deploys, or every deploy would invalidate every issued JWT.
  jwt_keys:

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: prod
      args:
        VITE_ENVIRONMENT: production
        VITE_APP_VERSION: ${APP_VERSION:-latest}
    image: ghcr.io/wonder-net/mincom-appraisal-nginx:${APP_VERSION:-latest}
    volumes:
      # Standard Certbot output layout — see docs/deployment.md Step 10.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    # Host's standard 80/443 map to the container's unprivileged
    # 8080/8443 — nginx runs as non-root (UID 1001) inside the
    # container and can't bind ports <1024 itself, but Docker's own
    # port publishing (host-side) doesn't need that privilege, so the
    # outside world still reaches the app on the standard ports.
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      php:
        condition: service_healthy
    networks:
      - symfony_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: ghcr.io/wonder-net/mincom-appraisal-symfony-backend:${APP_VERSION:-latest}
    env_file:
      - .env.prod.local
    volumes:
      - jwt_keys:/app/config/jwt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - symfony_prod
    user: "1001:1001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || true"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  messenger-consume-scheduler:
    image: ghcr.io/wonder-net/mincom-appraisal-symfony-backend:${APP_VERSION:-latest}
    # --time-limit/--memory-limit: recycle the worker periodically
    # (Docker's `restart: unless-stopped` immediately relaunches it) —
    # standard practice for long-running PHP workers, guards against
    # slow memory growth across days/weeks of uptime.
    command: php bin/console messenger:consume async scheduler_main --time-limit=3600 --memory-limit=128M -vv
    env_file:
      - .env.prod.local
    environment:
      # entrypoint.sh runs migrations/JWT-keypair-generation unless this
      # is set — documented there as required for exactly this service,
      # but never actually wired in until now: found by watching this
      # container's own logs run `doctrine:migrations:migrate`
      # concurrently with the `php` container on every startup.
      - SKIP_INIT=true
    volumes:
      - jwt_keys:/app/config/jwt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - symfony_prod
    user: "1001:1001"
    restart: unless-stopped
    # The image's baked-in HEALTHCHECK (docker/php/Dockerfile) pings
    # php-fpm — meaningless here, this container runs a CLI worker, not
    # php-fpm, and reported "unhealthy" forever as a result.
    healthcheck:
      disable: true

  messenger-consume-notifications:
    image: ghcr.io/wonder-net/mincom-appraisal-symfony-backend:${APP_VERSION:-latest}
    command: php bin/console messenger:consume notification_email --time-limit=3600 --memory-limit=128M -vv
    env_file:
      - .env.prod.local
    environment:
      - SKIP_INIT=true
    volumes:
      - jwt_keys:/app/config/jwt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - symfony_prod
    user: "1001:1001"
    restart: unless-stopped
    healthcheck:
      disable: true

  db:
    image: mysql:8.0
    # See docker-compose.yml's matching comment: MySQL 8.0 enables binary
    # logging by default, which blocks the baseline migration's
    # SIGNAL-based triggers for any non-SUPER user without this flag.
    # If using an external managed MySQL instead (RDS, Cloud SQL, etc.),
    # the equivalent server parameter needs setting there instead — most
    # managed providers expose it as a parameter-group / flag setting
    # rather than a command-line option.
    command: --log-bin-trust-function-creators=1
    env_file:
      - .env.prod.local
    networks:
      - symfony_prod
    volumes:
      - symfony_prod_mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - symfony_prod
    volumes:
      - symfony_prod_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
