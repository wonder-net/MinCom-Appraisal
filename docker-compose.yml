# symfony-backend/docker-compose.yml — isolated local dev environment for the
# Symfony rewrite. Fully separate from the root docker-compose*.yml (Django
# stack): own network, own MySQL/Redis instances, distinct host ports, so
# both stacks can run side by side during development. Not wired into the
# Django nginx or shared by any volume/network — see the migration plan
# (build-in-isolation, single cutover at the end).
#
# DB engine is MySQL, not Postgres: migrations/Version20260727144738.php
# is the squashed result of an already-completed Postgres->MySQL engine
# migration (see its own getDescription()) — this file just hadn't been
# updated to match afterward. docker/php/Dockerfile only ever installed
# pdo_mysql, so the previous postgres:16-alpine `db` service here could
# never actually have worked.
#
# Verified end-to-end against a real Docker daemon (colima): build,
# `doctrine:migrations:migrate` against a genuinely fresh MySQL 8.0
# database (all 4 migrations, 0 errors), admin bootstrap, a real JWT
# login round-trip, an encrypted-field read (FIELD_ENCRYPTION_KEY),
# and Redis-backed cache/rate-limiter activity all confirmed working.
# Found and fixed two real bugs in the process — neither hypothetical,
# both reproduced live:
#   - MySQL 8.0 enables binary logging by default, which blocks the
#     baseline migration's SIGNAL-based triggers for any non-SUPER
#     user (Error 1419) — needs --log-bin-trust-function-creators=1 on
#     the `db` service (below). MAMP's local MySQL never surfaced this
#     because that connection already has effective SUPER via root.
#   - SKIP_INIT (documented in entrypoint.sh as required for the
#     messenger-consume-* services) was never actually set anywhere,
#     so those containers raced the `php` container over migrations on
#     every startup.

networks:
  symfony_internal:
    driver: bridge

volumes:
  symfony_mysql_data:
  symfony_redis_data:

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    ports:
      - "8081:8080"
    depends_on:
      php:
        condition: service_healthy
    networks:
      - symfony_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null 2>&1 || true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    image: mincom-symfony-backend:dev
    env_file:
      - path: .env.local
        required: false
    environment:
      - APP_ENV=dev
      - DATABASE_URL=mysql://mincom_symfony:devpassword@db:3306/mincom_appraisal_symfony?serverVersion=8.0.32&charset=utf8mb4
      - MESSENGER_TRANSPORT_DSN=redis://redis:6379/messages
      - REDIS_URL=redis://redis:6379
      # mailpit catches all outbound mail here — web UI at localhost:8026.
      - MAILER_DSN=smtp://mailpit:1025
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - symfony_internal
    volumes:
      - .:/app
    user: "1001:1001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || true"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  messenger-consume-scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    image: mincom-symfony-backend:dev
    # scheduler_main replaces Celery Beat: it dispatches
    # SendOverdueRemindersMessage on the cron schedule defined in
    # App\Scheduler\MainSchedule (daily 08:00, matching Django's
    # CELERY_BEAT_SCHEDULE).
    command: php bin/console messenger:consume async scheduler_main -vv
    env_file:
      - path: .env.local
        required: false
    environment:
      - APP_ENV=dev
      - DATABASE_URL=mysql://mincom_symfony:devpassword@db:3306/mincom_appraisal_symfony?serverVersion=8.0.32&charset=utf8mb4
      - MESSENGER_TRANSPORT_DSN=redis://redis:6379/messages
      - REDIS_URL=redis://redis:6379
      - MAILER_DSN=smtp://mailpit:1025
      # entrypoint.sh runs migrations/JWT-keypair-generation unless this
      # is set — documented there as required for exactly this service,
      # but never actually wired in until now: found by watching this
      # container's own logs run `doctrine:migrations:migrate`
      # concurrently with the `php` container on every startup.
      - SKIP_INIT=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - symfony_internal
    volumes:
      - .:/app
    user: "1001:1001"
    restart: unless-stopped
    # The image's baked-in HEALTHCHECK (docker/php/Dockerfile) pings
    # php-fpm — meaningless here, this container runs a CLI worker, not
    # php-fpm, and reported "unhealthy" forever as a result.
    healthcheck:
      disable: true

  messenger-consume-notifications:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    image: mincom-symfony-backend:dev
    # Consumes SendNotificationEmailMessage (the 16 workflow/escalation/
    # cycle-activation notification emails) off its own transport — kept
    # separate from `async` so its retry_strategy (60s/120s/240s,
    # matching Django's Celery retry) doesn't affect bulk-import messages
    # on the `async` transport (see config/packages/messenger.yaml).
    command: php bin/console messenger:consume notification_email -vv
    env_file:
      - path: .env.local
        required: false
    environment:
      - APP_ENV=dev
      - DATABASE_URL=mysql://mincom_symfony:devpassword@db:3306/mincom_appraisal_symfony?serverVersion=8.0.32&charset=utf8mb4
      - MESSENGER_TRANSPORT_DSN=redis://redis:6379/messages
      - REDIS_URL=redis://redis:6379
      - MAILER_DSN=smtp://mailpit:1025
      - SKIP_INIT=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - symfony_internal
    volumes:
      - .:/app
    user: "1001:1001"
    restart: unless-stopped
    healthcheck:
      disable: true

  db:
    # Matches docker/php/Dockerfile (pdo_mysql only, no pdo_pgsql) and
    # migrations/Version20260727144738.php (MySQL-only DDL — ENGINE=
    # InnoDB, SIGNAL-based triggers — squashed after this app's own
    # Postgres->MySQL engine migration). Same major.minor as MAMP's
    # locally-verified mysql80 (8.0.32) and CI's `mysql:8.0` service.
    image: mysql:8.0
    # Binary logging is ON by default on MySQL 8.0's own image (unlike
    # 5.7) — without this flag, the baseline migration's two SIGNAL-based
    # triggers (audit_log's append-only guard) fail outright for any
    # non-SUPER user: "Error 1419: You do not have the SUPER privilege
    # and binary logging is enabled". Found by actually running
    # migrations against a genuinely fresh container, not by reading the
    # migration — MAMP's local MySQL never surfaced this because that
    # connection already has effective SUPER via its root account.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: mincom_appraisal_symfony
      MYSQL_USER: mincom_symfony
      MYSQL_PASSWORD: devpassword
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes" # only for the root user; app connects as mincom_symfony above
    ports:
      - "3307:3306" # distinct from this host's own MySQL installs (MAMP :8889, Homebrew :3306)
    networks:
      - symfony_internal
    volumes:
      - symfony_mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mincom_symfony", "-pdevpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6380:6379" # distinct from the Django stack's 6379
    networks:
      - symfony_internal
    volumes:
      - symfony_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025" # distinct from the Django stack's 8025
    networks:
      - symfony_internal
    restart: unless-stopped
