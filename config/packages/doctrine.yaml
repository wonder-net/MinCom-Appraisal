doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Server version is configured via `serverVersion` on DATABASE_URL instead of
        # here, since it can differ between local native dev and the containerized
        # target (see symfony-backend/.env vs docker-compose.yml).

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            # AES-256-GCM field-level encryption, port of Django's
            # EncryptedCharField/EncryptedTextField/EncryptedJSONField
            # (see App\Service\FieldEncryptor).
            encrypted_string: App\Doctrine\Type\EncryptedStringType
            encrypted_json: App\Doctrine\Type\EncryptedJsonType
            # Overrides Symfony's built-in `uuid` type (which stores as
            # BINARY(16) on MySQL, breaking Doctrine ORM's generic
            # entity-parameter binding — see UuidStringType's docblock) to
            # always store as CHAR(36) regardless of platform.
            uuid: App\Doctrine\Type\UuidStringType
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
