# =============================================================================
# symfony-backend/docker/nginx/default.prod.conf
# Production web tier for MINCOM Appraisal Platform — ONE container serves:
#   - TLS termination
#   - The built React SPA (static files, from /usr/share/nginx/html)
#   - The Symfony API + EasyAdmin (FastCGI straight to php:9000 — no proxy hop)
#
# Responsibilities:
#   - Redirect HTTP (port 8080) → HTTPS (port 8443) with 301
#   - Terminate TLS on port 8443 using certificate paths from Docker secrets
#   - Route /api/* and /admin* straight to Symfony's own front controller
#   - Serve the React SPA's built assets, falling back to index.html for
#     client-side routes
#   - Apply all security headers specified in CLAUDE.md
#   - Rate-limit auth endpoints (10 req/min) and standard endpoints (100 req/min)
#
# NOTE on add_header inheritance:
#   Nginx drops ALL parent-block add_header directives when a location block
#   defines even one add_header of its own.  To guarantee security headers are
#   present on every response, snippets/security-headers.conf is included
#   inside every location block (in addition to the server-block include).
# =============================================================================

# ----- Rate-limit zones (defined in http context, outside server blocks) -----
limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=100r/m;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

server_tokens off;

# =============================================================================
# HTTP server block — redirect all HTTP traffic to HTTPS
# =============================================================================
server {
    listen 8080;
    server_name _;

    # Health check endpoint — bypass the HTTPS redirect so Docker/load-balancer
    # probes on port 8080 receive 200 instead of 301 (wget treats 301 as failure).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    return 301 https://$host$request_uri;
}

# =============================================================================
# HTTPS server block — TLS termination + SPA + Symfony front controller
# =============================================================================
server {
    listen 8443 ssl;
    server_name _;

    # Symfony's own document root — needed for the fastcgi SCRIPT_FILENAME
    # resolution below. The SPA's built assets live in a separate root
    # (/usr/share/nginx/html), overridden per-location further down.
    root /app/public;

    # -------------------------------------------------------------------------
    # TLS configuration
    # Certificate paths are set via envsubst or hardcoded at deploy time.
    # TODO: replace with production domain and certificate paths
    # -------------------------------------------------------------------------
    ssl_certificate     /run/secrets/ssl_cert.pem;
    ssl_certificate_key /run/secrets/ssl_key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # -------------------------------------------------------------------------
    # Security headers (per CLAUDE.md)
    # -------------------------------------------------------------------------
    include /etc/nginx/snippets/security-headers.conf;

    # Maximum request body size (1 MB per API security spec)
    client_max_body_size 1m;

    # -------------------------------------------------------------------------
    # Gzip compression for text assets
    # -------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # -------------------------------------------------------------------------
    # Health check endpoint — returns 200 for Docker/load-balancer probes
    # -------------------------------------------------------------------------
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # Auth endpoints — stricter rate limit (10 req/min)
    # -------------------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|token/refresh|mfa/verify) {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Bulk-import endpoint — 6 MB limit (5 MB file + multipart overhead)
    # -------------------------------------------------------------------------
    location = /api/v1/admin/users/bulk-import/validate/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;

        client_max_body_size 6m;
        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Appraisal bulk-import — 55 MB limit (50 MB zip + multipart overhead)
    # -------------------------------------------------------------------------
    location = /api/v1/appraisals/bulk-import/validate/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;

        client_max_body_size 55m;
        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # General API endpoints — standard rate limit (100 req/min)
    # -------------------------------------------------------------------------
    # Note: this is intentionally a bare prefix (no ``^~``). Adding ``^~``
    # would short-circuit nginx's regex evaluation for ``/api/*`` paths,
    # which would silently disable the stricter auth-endpoint
    # ``login_zone`` rate-limit defined as a regex location above.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Symfony EasyAdmin (operator-only) — fixed at /admin.
    #
    # CORRECTION (found while verifying admin login end-to-end against a real
    # server — see public/.htaccess's identical fix for the local/MAMP path):
    # despite this block's original assumption, EasyAdminBundle does NOT
    # route every CRUD screen through the single literal path /admin via
    # query parameters — #[AdminDashboard(routePath: '/admin')] plus each
    # AbstractCrudController generates a real path-based route per entity
    # (confirmed via `bin/console debug:router | grep admin_.*_index`):
    # /admin/employee, /admin/department, /admin/sub-competency, etc. Only
    # routing the bare /admin, /admin/login, /admin/logout meant every other
    # EasyAdmin click fell through to the SPA `location /` block below
    # instead of reaching Symfony — nginx served the React shell, which has
    # no client route for e.g. /admin/sub-competency and bounced the operator
    # to the SPA's own login page instead of rendering the actual panel.
    #
    # IMPORTANT: every new AbstractCrudController adds a new entity slug —
    # add it to the alternation below too (`bin/console debug:router | grep
    # admin_.*_index` lists them all), or it silently falls through to the
    # SPA catch-all exactly as described above. The trailing (/|$) boundary
    # matters: it stops e.g. `competency` from swallowing `competency-rating`.
    #
    # Referrer-Policy override: security-headers.conf sets "no-referrer"
    # globally, which causes browsers to send "Origin: null" on HTML form
    # POSTs — Symfony's CSRF/session handling can reject null. "same-origin"
    # preserves Origin on same-origin POSTs while still suppressing it
    # cross-origin. Applied to every admin screen below (not just /admin
    # itself), since every entity's new/edit form does the same CSRF-guarded
    # same-origin POST.
    # -------------------------------------------------------------------------
    location = /admin {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "same-origin" always;
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    location = /admin/login {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "same-origin" always;
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    location = /admin/logout {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/admin/(employee|department|user|role|competency|sub-competency|bsc-perspective|notification|appraisal-cycle|appraisal|key-deliverable|competency-rating|growth-plan|career-plan|development-need|training-need|strength-weakness|signature|comment|calibration-session|score-descriptor|bulk-import-job|appraisal-bulk-import-job|user-bulk-import-job|refresh-token|recovery-code|password-reset-token|audit-log)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "same-origin" always;
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Symfony front controller — FastCGI straight to php:9000, no proxy hop.
    # Reached only via the internal try_files rewrites above.
    # -------------------------------------------------------------------------
    location ~ ^/index\.php(/|$) {
        internal;
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Deny direct access to any other .php file.
    location ~ \.php$ {
        return 404;
    }

    # -------------------------------------------------------------------------
    # React SPA — serve pre-built assets from /usr/share/nginx/html, falling
    # back to index.html for client-side routes (e.g. /admin/users, /reports).
    # -------------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Versioned Vite build assets — long-lived cache
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 429 /429.json;
    location = /429.json {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
        return 429 '{"status":"error","message":"Too many requests. Please slow down."}';
        add_header Content-Type application/json;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
        return 503 '{"status":"error","message":"Service temporarily unavailable."}';
        add_header Content-Type application/json;
    }
}
