# =============================================================================
# symfony-backend/docker/nginx/default.dev.conf
# Local development web tier — same shape as prod/uat but with relaxed rate
# limits (avoids tripping limits during manual testing) and no TLS.
#
# The frontend is a *built* bundle here too (baked into the image by the
# Dockerfile's frontend-build stage) — there is no Vite dev server / HMR in
# this setup. Rebuild the image to pick up frontend source changes.
# =============================================================================

limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/s;

server_tokens off;

server {
    listen 8080;
    server_name _;

    root /app/public;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # -------------------------------------------------------------------------
    # Health check
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # Auth endpoints
    # -------------------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|token/refresh|mfa/verify) {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=login_zone burst=20 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Employee bulk-import — 6 MB limit
    # -------------------------------------------------------------------------
    location = /api/v1/admin/users/bulk-import/validate/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;

        client_max_body_size 6m;
        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Appraisal bulk-import — 55 MB limit (50 MB zip + multipart overhead)
    # -------------------------------------------------------------------------
    location = /api/v1/appraisals/bulk-import/validate/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;

        client_max_body_size 55m;
        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # API endpoints
    # -------------------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Symfony EasyAdmin (operator-only) — fixed at /admin. See
    # default.prod.conf for the full rationale (identical routing here).
    # -------------------------------------------------------------------------
    location = /admin {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "same-origin" always;
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    location = /admin/login {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "same-origin" always;
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    location = /admin/logout {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Symfony front controller — FastCGI straight to php:9000, no proxy hop.
    # -------------------------------------------------------------------------
    location ~ ^/index\.php(/|$) {
        internal;
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~ \.php$ {
        return 404;
    }

    # -------------------------------------------------------------------------
    # React SPA — serve pre-built assets, falling back to index.html for
    # client-side routes.
    # -------------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 429 /429.json;
    location = /429.json {
        internal;
        return 429 '{"status":"error","message":"Too many requests. Please slow down."}';
        add_header Content-Type application/json;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        return 503 '{"status":"error","message":"Service temporarily unavailable."}';
        add_header Content-Type application/json;
    }
}
