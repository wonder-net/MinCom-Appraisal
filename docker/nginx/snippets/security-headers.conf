# =============================================================================
# symfony-backend/docker/nginx/snippets/security-headers.conf
#
# Security response headers required by CLAUDE.md.
#
# USAGE: Include this file in EVERY location block that also defines its own
# add_header directives.  Nginx silently drops all inherited add_header
# directives from a parent block when a child block defines even one
# add_header directive of its own (the "add_header inheritance bug").
# Including this snippet directly inside each affected location block
# guarantees the headers are always emitted, including on error responses.
#
# The `always` flag ensures headers are emitted for ALL response codes,
# not only 2xx responses.
#
# Used identically in dev/uat/prod — the app now always serves a *built*
# frontend bundle (no Vite dev server proxy to accommodate), so there is no
# need for a separate relaxed dev CSP allowing unsafe-eval/inline or ws:.
# =============================================================================

add_header X-Content-Type-Options      "nosniff"                                                                                                   always;
add_header X-Frame-Options             "DENY"                                                                                                       always;
add_header Content-Security-Policy     "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always; # TODO: replace with production domain
add_header Referrer-Policy             "no-referrer"                                                                                               always;
add_header Permissions-Policy          "camera=(), microphone=(), geolocation=()"                                                                  always;
add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload"                                                              always;
