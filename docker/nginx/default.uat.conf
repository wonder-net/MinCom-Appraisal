# =============================================================================
# symfony-backend/docker/nginx/default.uat.conf
# UAT web tier for MINCOM Appraisal Platform (ngrok-based UAT) — ONE container
# serves the built SPA and Symfony's API/EasyAdmin via FastCGI directly.
#
# Differences from default.prod.conf:
#   - No TLS termination (ngrok handles TLS upstream)
#   - No HTTP → HTTPS redirect
#   - Single server block listening on port 8080 (HTTP only)
#   - X-Forwarded-Proto is read from ngrok's own header, not $scheme
#
# Ngrok forwards HTTPS traffic to localhost:80 (→ container port 8080).
# Symfony's trusted-proxy config reads the X-Forwarded-Proto: https header
# that ngrok injects (see config/packages/framework.yaml's trusted_proxies).
# =============================================================================

limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=100r/m;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

server_tokens off;

server {
    listen 8080;
    server_name _;

    root /app/public;

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # -------------------------------------------------------------------------
    # Health check
    # -------------------------------------------------------------------------
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # Auth endpoints — stricter rate limit
    # -------------------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|token/refresh|mfa/verify) {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Bulk-import endpoint — 6 MB limit
    # -------------------------------------------------------------------------
    location = /api/v1/admin/users/bulk-import/validate/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;

        client_max_body_size 6m;
        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Appraisal bulk-import — 55 MB limit
    # -------------------------------------------------------------------------
    location = /api/v1/appraisals/bulk-import/validate/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;

        client_max_body_size 55m;
        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # General API endpoints
    # -------------------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Symfony EasyAdmin (operator-only) — fixed at /admin. See default.prod.conf
    # for the full rationale (identical routing here) — including the regex
    # block below, required so each EasyAdmin entity's own real path-based
    # route (e.g. /admin/sub-competency) reaches Symfony instead of falling
    # through to the SPA. Keep the alternation in sync with
    # default.prod.conf's (same source of truth: `bin/console debug:router
    # | grep admin_.*_index`).
    # -------------------------------------------------------------------------
    location = /admin {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "same-origin" always;
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    location = /admin/login {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "same-origin" always;
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    location = /admin/logout {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/admin/(employee|department|user|role|competency|sub-competency|bsc-perspective|notification|appraisal-cycle|appraisal|key-deliverable|competency-rating|growth-plan|career-plan|development-need|training-need|strength-weakness|signature|comment|calibration-session|score-descriptor|bulk-import-job|appraisal-bulk-import-job|user-bulk-import-job|refresh-token|recovery-code|password-reset-token|audit-log)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "same-origin" always;
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;

        try_files $uri /index.php$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Symfony front controller — FastCGI straight to php:9000, no proxy hop.
    # -------------------------------------------------------------------------
    location ~ ^/index\.php(/|$) {
        internal;
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~ \.php$ {
        return 404;
    }

    # -------------------------------------------------------------------------
    # React SPA
    # -------------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 429 /429.json;
    location = /429.json {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
        return 429 '{"status":"error","message":"Too many requests. Please slow down."}';
        add_header Content-Type application/json;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
        return 503 '{"status":"error","message":"Service temporarily unavailable."}';
        add_header Content-Type application/json;
    }
}
